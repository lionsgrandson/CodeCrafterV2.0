name: SEO and build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build and SEO validation
        run: npm run build

      - name: Contact and scroll unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility checks
        run: npm run test:e2e
